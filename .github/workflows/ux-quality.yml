name: Portfolio UX quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install audit tooling
        run: npm install --no-save @playwright/test@1.55.0 @axe-core/playwright@4.10.2 serve@14.2.4 @lhci/cli@0.15.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run responsive and accessibility audit
        shell: bash
        run: |
          set -euo pipefail
          npx serve site -l 4173 >/tmp/portfolio-serve.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          node scripts/ux-audit.mjs\n          node scripts/capture-ux-screenshots.mjs
      - name: Upload UX review screenshots\n        if: always()\n        uses: actions/upload-artifact@v4\n        with:\n          name: ux-review-${{ github.sha }}\n          path: ux-screenshots/\n          if-no-files-found: error\n          retention-days: 30\n      - name: Enforce Lighthouse budgets
        run: npx lhci autorun --config=./lighthouserc.cjs
