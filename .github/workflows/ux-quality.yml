name: Portfolio UX quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: Deploy Pages after the qualified project-path build
        required: true
        type: boolean
        default: false
      retain_detailed_evidence:
        description: Keep full audit diagnostics for a deliberate manual review
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: portfolio-ux-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Classifies the change and decides, in one tested place, which jobs and audits it needs.
  scope:
    name: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      fast_path: ${{ steps.scope.outputs.fast_path }}
      review_scope: ${{ steps.scope.outputs.review_scope }}
      checks: ${{ steps.select.outputs.checks }}
      media: ${{ steps.select.outputs.media }}
      lighthouse: ${{ steps.select.outputs.lighthouse }}
      bundle: ${{ steps.select.outputs.bundle }}
      pages: ${{ steps.select.outputs.pages }}
      audits: ${{ steps.select.outputs.audits }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify UX qualification scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BASE_SHA"
          fi

          fast_path=false
          review_scope=full
          reason="full UX qualification required"
          if [[ "$base" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$base" =~ ^0+$ ]] && [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            mapfile -t changed < <(git diff --name-only "$base" "$HEAD_SHA")
            mapfile -t deleted < <(git diff --diff-filter=D --name-only "$base" "$HEAD_SHA")
            allowed=true
            saw_route_change=false

            if [ "${#changed[@]}" -eq 0 ] || [ "${#deleted[@]}" -ne 0 ]; then
              allowed=false
            fi

            for path in "${changed[@]}"; do
              case "$path" in
                site/card.md|site/staticwebapp.config.json|site/robots.txt|site/llms.txt)
                  saw_route_change=true
                  ;;
                scripts/test_static_webapp_config.py|.github/workflows/ux-quality.yml)
                  ;;
                *)
                  allowed=false
                  ;;
              esac
            done

            if [ "$allowed" = true ] && [ "$saw_route_change" = true ]; then
              fast_path=true
              reason="only ARCC route/profile/discovery files and their dedicated regression/CI definition changed"
            fi

            if [ "$EVENT_NAME" = pull_request ] && [ "$fast_path" != true ]; then
              candidate="$(python3 scripts/classify_ux_scope.py --event "$EVENT_NAME" "$base" "$HEAD_SHA" || true)"
              case "$candidate" in
                page-text) review_scope=page-text; reason="text-only edits to existing static pages" ;;
                article-audit) review_scope=article-audit; reason="only existing article-model audit scripts changed" ;;
                search) review_scope=search; reason="only the search runtime changed" ;;
                documentation) review_scope=documentation; fast_path=true; reason="only existing repository documentation changed" ;;
              esac
            fi

            {
              echo "### UX scope classification"
              echo
              echo "- Base: `$base`"
              echo "- Head: `$HEAD_SHA`"
              echo "- Fast path: `$fast_path`"
              echo "- Review scope: `$review_scope`"
              echo "- Reason: $reason"
              echo "- Changed paths:"
              printf '  - `%s`\n' "${changed[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "fast_path=$fast_path" >> "$GITHUB_OUTPUT"
          echo "review_scope=$review_scope" >> "$GITHUB_OUTPUT"
      - name: Test conservative UX scope classification
        run: python3 -m unittest discover -s scripts -p test_classify_ux_scope.py -v
      - name: Select the jobs and audits this change needs
        id: select
        shell: bash
        env:
          FAST_PATH: ${{ steps.scope.outputs.fast_path }}
          REVIEW_SCOPE: ${{ steps.scope.outputs.review_scope }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p test_select_ux_audits.py -v
          python3 -m unittest discover -s scripts -p test_require_ux_jobs.py -v
          python3 scripts/select_ux_audits.py --event "$GITHUB_EVENT_NAME" --fast-path "$FAST_PATH" --scope "$REVIEW_SCOPE" | tee -a "$GITHUB_OUTPUT"
      - name: Validate scoped ARCC routing contract
        if: ${{ steps.scope.outputs.fast_path == 'true' && steps.scope.outputs.review_scope != 'documentation' }}
        run: python3 scripts/test_static_webapp_config.py
      - name: Check scoped documentation diff
        if: ${{ steps.scope.outputs.review_scope == 'documentation' }}
        run: git diff --check '${{ github.event.pull_request.base.sha }}' '${{ github.event.pull_request.head.sha }}'

  # Source-level checks: syntax, unit tests and the committed poster provenance. No bundle needed.
  checks:
    name: checks
    needs: scope
    if: ${{ needs.scope.outputs.checks == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/node-ux
      - name: Check UX environment
        run: python3 scripts/preflight_env.py ux
      - name: Verify committed native poster provenance
        run: node scripts/test-model-startup.mjs
      - name: Check source syntax and audit regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/build-homepage-loop.mjs
          python3 -m unittest discover -s scripts -p test_verify_homepage_recording.py -v
          for asset in site appearance article-runtime article-model-loader article-model-context article-model-presentation article-lm-session model-context model-inference model-inference-backend model-presentation-sampling model-linear-webnn model-linear-webgpu model-lm-worker model-machine model-scene model-encased-materials model-encased-housing model-encased-routes model-renderer model-background-glass model-topology model-light model-gestures material-light energy-architecture energy-optics homepage-background homepage-motion homepage-native-model physical-stage physical-studio homepage-model-loader homepage-digital research-topology search; do
            node --check "site/assets/$asset.js"
          done
          node scripts/test-homepage-media-inputs.mjs
          node scripts/test-model-replay.mjs
          node scripts/test-model-inference.mjs
          node scripts/test-model-instrument-orientation.mjs
          node scripts/test-article-release-observation.mjs
          node scripts/test-model-pixel-fidelity.mjs
          node scripts/test-article-runtime.mjs
          node scripts/test-interaction-coverage.mjs
          node scripts/test-jupyterlite-notebook-audit.mjs
          node scripts/test-lighthouse-transfer-budget.mjs
          node scripts/test-serve-lhci.mjs

  # Renders the homepage recording once. PR runs reuse it when its exact inputs are unchanged.
  record:
    name: record
    needs: scope
    if: ${{ needs.scope.outputs.media == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      media_artifact: ${{ steps.names.outputs.media }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/node-ux
      - name: Install homepage media renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Check UX environment
        run: python3 scripts/preflight_env.py ux
      - name: Name the media artifact
        id: names
        run: echo "media=homepage-media-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      # Cache only PR review media. The recording's exact input files (see
      # scripts/homepage-media-inputs.mjs), browser, runner image and installed package
      # versions all participate in the key. UI-only edits therefore keep the cache.
      # Main-push qualification always generates a fresh recording.
      - name: Fingerprint media inputs and environment
        id: media_env
        shell: bash
        run: |
          set -euo pipefail
          browser="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          signature="$( { node --version; ffmpeg -version 2>&1 | sed -n '1p'; sha256sum "$browser"; printf '%s\n' "${ImageVersion:-unknown}"; dpkg-query -W -f='${Package} ${Version}\n'; } | sha256sum | cut -d' ' -f1)"
          echo "signature=$signature" >> "$GITHUB_OUTPUT"
          echo "inputs=$(node scripts/homepage-media-inputs.mjs)" >> "$GITHUB_OUTPUT"
      - name: Restore exact-input PR homepage media
        if: ${{ github.event_name == 'pull_request' }}
        id: media_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            site/assets/homepage-model-loop.webm
            site/assets/homepage-model-loop-poster.webp
            site/assets/homepage-model-loop.json
          key: portfolio-home-v2-${{ runner.os }}-${{ steps.media_env.outputs.signature }}-${{ steps.media_env.outputs.inputs }}
      - name: Render trained homepage model recording
        if: ${{ github.event_name != 'pull_request' || steps.media_cache.outputs.cache-hit != 'true' }}
        run: node scripts/build-homepage-loop.mjs
      - name: Verify homepage media bytes and trained tensors
        run: node scripts/verify-homepage-recording.mjs
      - name: Save exact-input PR homepage media
        if: ${{ github.event_name == 'pull_request' && steps.media_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            site/assets/homepage-model-loop.webm
            site/assets/homepage-model-loop-poster.webp
            site/assets/homepage-model-loop.json
          key: ${{ steps.media_cache.outputs.cache-primary-key }}
      - name: Record homepage media source and checksums
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf '%s\n' "$SOURCE_SHA" > site/assets/homepage-model-loop.source
          sha256sum site/assets/homepage-model-loop.webm site/assets/homepage-model-loop-poster.webp site/assets/homepage-model-loop.json > site/assets/homepage-model-loop.sha256
      - name: Share exact-run homepage media with the build and audit jobs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.names.outputs.media }}
          path: |
            site/assets/homepage-model-loop.webm
            site/assets/homepage-model-loop-poster.webp
            site/assets/homepage-model-loop.json
            site/assets/homepage-model-loop.source
            site/assets/homepage-model-loop.sha256
          if-no-files-found: error
          retention-days: 1

  # Lighthouse budgets for the source site. Independent of the bundle, so it runs beside it.
  lighthouse:
    name: lighthouse
    needs: [scope, record]
    if: ${{ needs.scope.outputs.lighthouse == 'true' && needs.record.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/node-ux
        with:
          browser: 'false'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.record.outputs.media_artifact }}
          path: site/assets
      - name: Verify transferred homepage media and source identity
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(cat site/assets/homepage-model-loop.source)" = "$SOURCE_SHA"
          sha256sum --check site/assets/homepage-model-loop.sha256
          rm -- site/assets/homepage-model-loop.source site/assets/homepage-model-loop.sha256
          node scripts/verify-homepage-recording.mjs
      - name: Enforce Lighthouse budgets (mobile and desktop)
        shell: bash
        run: |
          set -uo pipefail
          rm -f lhci-server.log
          node scripts/serve-lhci.mjs site > lhci-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; wait "$server" 2>/dev/null || true' EXIT
          port=''
          ready=false
          for _ in {1..30}; do
            port="$(sed -n 's/^PORT=//p' lhci-server.log | tail -n 1)"
            if [[ "$port" =~ ^[0-9]+$ ]] && \
              curl -fsS "http://127.0.0.1:$port/" >/dev/null && \
              curl -fsS "http://127.0.0.1:$port/about/" >/dev/null && \
              curl -fsS "http://127.0.0.1:$port/atlas/" >/dev/null && \
              curl -fsS "http://127.0.0.1:$port/reproduce/" >/dev/null && \
              curl -fsS "http://127.0.0.1:$port/research/" >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat lhci-server.log
            echo 'Owned Lighthouse server did not become ready for every audited route.' >&2
            exit 1
          fi
          export PORTFOLIO_LHCI_BASE_URL="http://127.0.0.1:$port"
          run_lhci() {
            local config="$1" profile="$2" result=0
            local log="$RUNNER_TEMP/portfolio-lhci-$profile.log"
            npx lhci autorun --config="$config" 2>&1 | tee "$log"
            result=${PIPESTATUS[0]}
            if [ "$result" -eq 0 ]; then return 0; fi
            local fatal='Runtime error encountered: Waiting for DevTools protocol response has exceeded the allotted time. (Method: Network.getResponseBody)'
            local terminal
            terminal="$(awk 'NF { line=$0 } END { print line }' "$log")"
            # Keep hard assertion failures terminal. A fatal collection timeout
            # gets one fresh autorun of the complete identical profile.
            if [ "$result" -ne 1 ] || \
              ! grep -Fq '"code": "PROTOCOL_TIMEOUT"' "$log" || \
              [ "$terminal" != "$fatal" ] || \
              grep -Eq 'Done running Lighthouse!|assert command failed|upload command failed' "$log"; then
              return "$result"
            fi
            # Preserve partial reports and any prior assertion receipt. The
            # next complete collection must start without either as input.
            local first_state="$RUNNER_TEMP/portfolio-lhci-$profile-first-state"
            if [ -e "$first_state" ]; then return 1; fi
            if [ -d .lighthouseci ]; then mv -- .lighthouseci "$first_state" || return 1; fi
            printf '\nLighthouse %s: fatal response-body collection timeout; retrying the complete identical profile once. LHCI already retries each numbered run internally; other internal errors are not exposed here.\n' "$profile" | tee -a "$GITHUB_STEP_SUMMARY"
            npx lhci autorun --config="$config" 2>&1 | tee "$RUNNER_TEMP/portfolio-lhci-$profile-retry.log"
            return "${PIPESTATUS[0]}"
          }
          status=0
          npx lhci autorun --config=./lighthouserc.cjs || status=$?
          desktop_status=0
          run_lhci ./lighthouserc.desktop.cjs desktop || desktop_status=$?
          if [ "$status" -ne 0 ] || [ "$desktop_status" -ne 0 ]; then
            echo "LHCI failures: mobile=$status desktop=$desktop_status" >&2
            exit 1
          fi
      - name: Check initial-page transfer policy
        run: node scripts/lighthouse-transfer-budget.mjs --dir ./lighthouse-results --dir ./lighthouse-results-desktop
      - name: Retain raw Lighthouse reports
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.retain_detailed_evidence }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            lighthouse-results/
            lighthouse-results-desktop/
            lhci-server.log
            ${{ runner.temp }}/portfolio-lhci-*.log
            ${{ runner.temp }}/portfolio-lhci-*-first-state/
          if-no-files-found: warn
          retention-days: 30

  # Builds the exact public bundle once. On main it is the candidate Fleet consumes;
  # elsewhere it is short-lived staging for the audit jobs.
  build:
    name: Public publication candidate
    needs: [scope, record]
    if: ${{ needs.scope.outputs.bundle == 'true' && needs.record.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      bundle_artifact: ${{ steps.names.outputs.bundle }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: Portfolio
          persist-credentials: false
      - name: Pin public input revisions
        id: refs
        shell: bash
        env:
          PORTFOLIO_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          portfolio="$PORTFOLIO_SOURCE_SHA"
          python3 - <<'PY' > "$RUNNER_TEMP/portfolio-public-source-pins"
          import json, re
          from pathlib import Path
          pins = json.loads(Path('Portfolio/publication/public-sources.lock.json').read_text())
          assert set(pins) == {'schemaVersion', 'researchNotes', 'theoremLibrary'}
          assert type(pins['schemaVersion']) is int and pins['schemaVersion'] == 1
          for field in ('researchNotes', 'theoremLibrary'):
              assert isinstance(pins[field], str) and re.fullmatch(r'[0-9a-f]{40}', pins[field])
              print(pins[field])
          PY
          mapfile -t source_pins < "$RUNNER_TEMP/portfolio-public-source-pins"
          research_notes="${source_pins[0]}"
          theorem_library="${source_pins[1]}"
          for revision in "$portfolio" "$research_notes" "$theorem_library"; do
            [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo 'Expected full source commit SHAs'; exit 1; }
          done
          {
            echo "portfolio=$portfolio"
            echo "research_notes=$research_notes"
            echo "theorem_library=$theorem_library"
          } >> "$GITHUB_OUTPUT"
      - name: Read immutable public Compiler input pin
        id: compiler
        run: python3 Portfolio/scripts/compiler_projection_input.py --pin Portfolio/publication/compiler-projection.lock.json >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: pH34r-pH/experiment-compiler
          ref: ${{ steps.compiler.outputs.commit }}
          path: experiment-compiler
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: pH34r-pH/research-notes
          ref: ${{ steps.refs.outputs.research_notes }}
          path: research-notes
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: pH34r-pH/theorem-library
          ref: ${{ steps.refs.outputs.theorem_library }}
          path: theorem-library
          persist-credentials: false
      - name: Confirm pinned checkouts
        shell: bash
        env:
          PORTFOLIO_SHA: ${{ steps.refs.outputs.portfolio }}
          RESEARCH_NOTES_SHA: ${{ steps.refs.outputs.research_notes }}
          THEOREM_LIBRARY_SHA: ${{ steps.refs.outputs.theorem_library }}
          COMPILER_SHA: ${{ steps.compiler.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(git -C Portfolio rev-parse HEAD)" = "$PORTFOLIO_SHA"
          test "$(git -C research-notes rev-parse HEAD)" = "$RESEARCH_NOTES_SHA"
          test "$(git -C theorem-library rev-parse HEAD)" = "$THEOREM_LIBRARY_SHA"
          test "$(git -C experiment-compiler rev-parse HEAD)" = "$COMPILER_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Portfolio/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - uses: typst-community/setup-typst@v4
      - name: Install document export image conversion
        run: |
          sudo apt-get update
          sudo apt-get install -y inkscape
      - name: Install pinned Portfolio and MyST browser tooling
        run: npm ci --prefix Portfolio
      - name: Retrieve homepage media from this run's recording job
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.record.outputs.media_artifact }}
          path: Portfolio/site/assets
      - name: Verify transferred homepage media and source identity
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.refs.outputs.portfolio }}
        run: |
          set -euo pipefail
          cd Portfolio
          test "$(cat site/assets/homepage-model-loop.source)" = "$SOURCE_SHA"
          sha256sum --check site/assets/homepage-model-loop.sha256
          rm -- site/assets/homepage-model-loop.source site/assets/homepage-model-loop.sha256
          node scripts/verify-homepage-recording.mjs
      - name: Prepare isolated article export sources
        run: |
          python3 Portfolio/scripts/prepare_article_exports.py \
            --research-notes research-notes \
            --output research-notes-exports \
            --manifest article-exports.json
      - name: Build PDF, Word, LaTeX and JATS article exports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/portfolio-article-export-sources
          import json
          for item in json.load(open('article-exports.json', encoding='utf-8')):
              print(item['source'])
          PY
          while IFS= read -r source; do
            (cd research-notes-exports && ../Portfolio/node_modules/.bin/myst build "$source" --ci)
          done < /tmp/portfolio-article-export-sources
      - name: Render canonical MyST articles from the pinned Research Notes checkout
        working-directory: research-notes
        run: ../Portfolio/node_modules/.bin/myst build --html --strict --ci
      - name: Install locked publication tooling
        run: uv sync --project Portfolio --locked --no-dev
      - name: Check publication environment
        run: uv run --project Portfolio --no-sync python Portfolio/scripts/preflight_env.py publication
      - name: Check reader and publication code
        run: |
          node --check Portfolio/scripts/rewrite_javascript_urls.mjs
          uv run --project Portfolio --no-sync python -m py_compile Portfolio/scripts/build_portfolio_bundle.py Portfolio/scripts/finish_portfolio_lab.py Portfolio/scripts/digest_bundle.py Portfolio/scripts/compiler_projection_input.py Portfolio/scripts/prepare_github_pages.py
          uv run --project Portfolio --no-sync python Portfolio/scripts/test_portfolio_publication.py
          uv run --project Portfolio --no-sync python Portfolio/scripts/test_prepare_github_pages.py
      - name: Generate the pinned Compiler public static projection
        run: python3 experiment-compiler/scripts/build_pages_site.py --output compiler-public
      - name: Assemble immutable public inputs
        env:
          PORTFOLIO_SHA: ${{ steps.refs.outputs.portfolio }}
          RESEARCH_NOTES_SHA: ${{ steps.refs.outputs.research_notes }}
          THEOREM_LIBRARY_SHA: ${{ steps.refs.outputs.theorem_library }}
        run: |
          uv run --project Portfolio --no-sync python Portfolio/scripts/build_portfolio_bundle.py \
            --portfolio Portfolio --research-notes research-notes \
            --theorem-library theorem-library \
            --myst-html research-notes/_build/html/index.html --output bundle \
            --portfolio-sha "$PORTFOLIO_SHA" \
            --research-notes-sha "$RESEARCH_NOTES_SHA" \
            --theorem-library-sha "$THEOREM_LIBRARY_SHA" \
            --compiler-projection compiler-public/data/experiments.json \
            --compiler-projection-pin Portfolio/publication/compiler-projection.lock.json
      - name: Attach static article export artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/article-exports
          python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path
          records = json.load(open('article-exports.json', encoding='utf-8'))
          source = Path('research-notes-exports/articles/_build/exports')
          target = Path('bundle/article-exports')
          for item in records:
              for key in ('pdf', 'docx', 'latex', 'jats'):
                  name = item[key]
                  artifact = source / name
                  if not artifact.is_file():
                      raise SystemExit(f'Missing MyST export: {artifact}')
                  shutil.copy2(artifact, target / name)
          print(f"Attached {len(records) * 4} article exports")
          PY
      - name: Validate pinned publication manifest
        env:
          PORTFOLIO_SHA: ${{ steps.refs.outputs.portfolio }}
          RESEARCH_NOTES_SHA: ${{ steps.refs.outputs.research_notes }}
          THEOREM_LIBRARY_SHA: ${{ steps.refs.outputs.theorem_library }}
          COMPILER_SHA: ${{ steps.compiler.outputs.commit }}
          COMPILER_PROJECTION_SHA256: ${{ steps.compiler.outputs.sha256 }}
        run: |
          uv run --project Portfolio --no-sync python - <<'PY'
          import json
          import os
          from pathlib import Path
          from jsonschema import Draft202012Validator

          manifest = json.loads(Path('bundle/publication.json').read_text())
          schema = json.loads(Path('Portfolio/publication.schema.json').read_text())
          Draft202012Validator(schema).validate(manifest)
          assert manifest['schemaVersion'] == 2
          assert {key: value['commit'] for key, value in manifest['sources'].items()} == {
              'portfolio': os.environ['PORTFOLIO_SHA'],
              'researchNotes': os.environ['RESEARCH_NOTES_SHA'],
              'theoremLibrary': os.environ['THEOREM_LIBRARY_SHA'],
          }
          assert manifest['compilerProjection'] == {
              'repository': 'pH34r-pH/experiment-compiler',
              'commit': os.environ['COMPILER_SHA'],
              'sha256': os.environ['COMPILER_PROJECTION_SHA256'],
              'schemaVersion': 2,
          }
          atlas = json.loads(Path('bundle/data/atlas-evidence.json').read_text())
          atlas_schema = json.loads(Path('Portfolio/atlas-evidence.schema.json').read_text())
          Draft202012Validator(atlas_schema).validate(atlas)
          PY
      - name: Build JupyterLite
        run: |
          uv run --project Portfolio --no-sync jupyter lite build --contents bundle/publication/lab-contents \
            --output-dir bundle/lab --lite-dir Portfolio
      - name: Attach Portfolio Lab navigation
        run: uv run --project Portfolio --no-sync python Portfolio/scripts/finish_portfolio_lab.py --portfolio Portfolio --bundle bundle
      - name: Build static publication search index
        run: npx --yes pagefind@1.5.2 --site bundle --output-subdir pagefind --force-language en
      - name: Qualify finished public bundle
        shell: bash
        run: |
          set -euo pipefail
          for path in bundle/index.html bundle/publication.json bundle/data/atlas-evidence.json \
            bundle/pagefind/pagefind.js bundle/lab/index.html bundle/lab/lab/index.html bundle/lab/files/reference/glossary.md \
            bundle/lab/reference/glossary.md; do
            test -s "$path"
          done
          count="$(find bundle/publication/notebooks -name '*.ipynb' -type f | wc -l)"
          test "$count" -gt 0
          python - <<'PY'
          import hashlib, json, zipfile
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = Path('bundle')
          manifest = json.loads((root / 'publication.json').read_text())
          articles = manifest.get('articles')
          assert isinstance(articles, list) and articles, 'No canonical articles in the exact bundle'
          for article in articles:
              route = root / article['url'].strip('/') / 'index.html'
              source = root / article['path']
              assert route.is_file() and source.is_file(), f"Missing article route or source: {article['slug']}"
              assert hashlib.sha256(route.read_bytes()).hexdigest() == article['renderedSha256']
              assert hashlib.sha256(source.read_bytes()).hexdigest() == article['sha256']
              body = route.read_text(encoding='utf-8')
              assert 'myst-reader' in body and 'Canonical MyST source' in body
              for label in ('PDF', 'Word', 'LaTeX source', 'JATS XML'):
                  assert label in body, f"Missing article download link {label}: {article['slug']}"
              downloads = {kind: root / path.lstrip('/') for kind, path in article['downloads'].items()}
              assert set(downloads) == {'pdf', 'docx', 'latex', 'jats'}
              for kind, artifact in downloads.items():
                  assert artifact.is_file() and artifact.stat().st_size > 0, f"Missing {kind} export: {article['slug']}"
              assert downloads['pdf'].read_bytes().startswith(b'%PDF-'), f"Invalid PDF export: {article['slug']}"
              assert zipfile.is_zipfile(downloads['docx']), f"Invalid DOCX export: {article['slug']}"
              assert zipfile.is_zipfile(downloads['latex']), f"Invalid LaTeX ZIP: {article['slug']}"
              with zipfile.ZipFile(downloads['latex']) as archive:
                  assert any(name.endswith('.tex') for name in archive.namelist()), f"LaTeX ZIP has no .tex source: {article['slug']}"
              ET.parse(downloads['jats'])
              for asset in article['assets']:
                  assert (root / 'publication/article-assets' / asset).is_file(), f"Missing MyST asset: {asset}"
              if article['browserExecution']:
                  assert '/assets/article-runtime.js' in body
                  assert (root / 'assets/thebe/thebe-lite.min.js').is_file()
                  assert (root / 'assets/thebe/index.js').is_file()
                  assert (root / 'lab/lab/index.html').is_file()
          print(f"Qualified {len(manifest['notebooks'])} source notebooks and {len(articles)} canonical articles")
          PY
      - name: Name the bundle artifact
        id: names
        shell: bash
        env:
          PORTFOLIO_SHA: ${{ steps.refs.outputs.portfolio }}
          RESEARCH_NOTES_SHA: ${{ steps.refs.outputs.research_notes }}
          THEOREM_LIBRARY_SHA: ${{ steps.refs.outputs.theorem_library }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            name="portfolio-candidate-${PORTFOLIO_SHA}-${RESEARCH_NOTES_SHA}-${THEOREM_LIBRARY_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          else
            name="bundle-staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          echo "bundle=$name" >> "$GITHUB_OUTPUT"
      - name: Hash exact upload bytes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: digest
        shell: bash
        run: echo "sha256=$(uv run --project Portfolio --no-sync python Portfolio/scripts/digest_bundle.py bundle)" >> "$GITHUB_OUTPUT"
      - name: Upload public publication candidate
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.names.outputs.bundle }}
          path: bundle/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 7 || 1 }}
      - name: Summarize public candidate for private verification
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PORTFOLIO_SHA: ${{ steps.refs.outputs.portfolio }}
          RESEARCH_NOTES_SHA: ${{ steps.refs.outputs.research_notes }}
          THEOREM_LIBRARY_SHA: ${{ steps.refs.outputs.theorem_library }}
          COMPILER_SHA: ${{ steps.compiler.outputs.commit }}
          COMPILER_PROJECTION_SHA256: ${{ steps.compiler.outputs.sha256 }}
          BUNDLE_SHA256: ${{ steps.digest.outputs.sha256 }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_SHA256: ${{ steps.upload.outputs.artifact-digest }}
        shell: bash
        run: |
          {
            echo '## Public Portfolio publication candidate'
            echo
            echo "- Portfolio source: $PORTFOLIO_SHA"
            echo "- research-notes source: $RESEARCH_NOTES_SHA"
            echo "- theorem-library source: $THEOREM_LIBRARY_SHA"
            echo "- Compiler public projection source: $COMPILER_SHA"
            echo "- Compiler public projection SHA-256: $COMPILER_PROJECTION_SHA256"
            echo "- Full bundle tree SHA-256: $BUNDLE_SHA256"
            echo "- Exact artifact ID: $ARTIFACT_ID"
            echo "- GitHub artifact ZIP SHA-256: $ARTIFACT_SHA256"
            echo "- Public source and producer run/attempt: $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
            echo '- Private Fleet must recheck all source gates and the downloaded bundle digest before publication.'
          } >> "$GITHUB_STEP_SUMMARY"


  # One job per audit, all against the finished bundle, in parallel. The matrix comes from scripts/select_ux_audits.py.
  audit:
    name: audit (${{ matrix.name }})
    needs: [scope, record, build]
    if: ${{ needs.build.result == 'success' && needs.scope.outputs.audits != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.audits) }}
    env:
      PORTFOLIO_AUDIT_URL: http://127.0.0.1:4173
      PORTFOLIO_PUBLICATION_BUNDLE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: Portfolio
          persist-credentials: false
      - uses: ./Portfolio/.github/actions/node-ux
        with:
          directory: Portfolio
      - name: Retrieve homepage media from this run's recording job
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.record.outputs.media_artifact }}
          path: Portfolio/site/assets
      - name: Verify transferred homepage media and source identity
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          cd Portfolio
          test "$(cat site/assets/homepage-model-loop.source)" = "$SOURCE_SHA"
          sha256sum --check site/assets/homepage-model-loop.sha256
          rm -- site/assets/homepage-model-loop.source site/assets/homepage-model-loop.sha256
      - name: Retrieve the exact bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.bundle_artifact }}
          path: bundle
      - name: Check UX environment
        working-directory: Portfolio
        run: python3 scripts/preflight_env.py ux
      - name: Run ${{ matrix.name }}
        working-directory: Portfolio
        shell: bash
        env:
          AUDIT_NAME: ${{ matrix.name }}
          AUDIT_RUN: ${{ matrix.run }}
        run: |
          set -uo pipefail
          node_modules/.bin/serve ../bundle -l tcp://127.0.0.1:4173 >"$RUNNER_TEMP/portfolio-bundle-serve.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          kill -0 "$server_pid"
          curl -fsS http://127.0.0.1:4173/publication.json >/dev/null
          mkdir -p ux-screenshots/logs
          started=$SECONDS
          bash -c "$AUDIT_RUN" 2>&1 | tee "ux-screenshots/logs/$AUDIT_NAME.log"
          status=${PIPESTATUS[0]}
          result=PASS; [ "$status" -eq 0 ] || result=FAIL
          printf '| %s | %s | %ss |\n' "$AUDIT_NAME" "$result" "$((SECONDS - started))" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload audit evidence on failure or manual review
        if: ${{ failure() || (always() && github.event_name == 'workflow_dispatch' && inputs.retain_detailed_evidence) }}
        uses: actions/upload-artifact@v4
        with:
          name: audit-evidence-${{ matrix.name }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: Portfolio/ux-screenshots/
          if-no-files-found: warn
          retention-days: 3

  # Project-path GitHub Pages copy of the bundle: reviewed on PRs, deployable on manual runs.
  pages-copy:
    name: pages-copy
    needs: [scope, build]
    if: ${{ needs.build.result == 'success' && needs.scope.outputs.pages == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact_name: ${{ steps.pages_preview.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: Portfolio
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - uses: ./Portfolio/.github/actions/node-ux
        with:
          directory: Portfolio
      - name: Install locked publication tooling
        run: uv sync --project Portfolio --locked --no-dev
      - name: Retrieve the exact bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.bundle_artifact }}
          path: bundle
      - name: Prepare and test the project-path Pages copy
        id: pages_preview
        shell: bash
        env:
          PORTFOLIO_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          repository_name="${PORTFOLIO_REPOSITORY#*/}"
          base_path="/$repository_name"
          uv run --project Portfolio --no-sync python Portfolio/scripts/prepare_github_pages.py \
            bundle pages-site --base-path "$base_path"
          preview_root="$RUNNER_TEMP/portfolio-pages-preview"
          mkdir -p "$preview_root/$repository_name"
          cp -a pages-site/. "$preview_root/$repository_name/"
          artifact_name="portfolio-pages-$repository_name-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          Portfolio/node_modules/.bin/serve "$preview_root" -l tcp://127.0.0.1:4174 > /tmp/portfolio-pages-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          for _ in {1..30}; do
            if curl -fsS "http://127.0.0.1:4174$base_path/" >/dev/null; then break; fi
            sleep 1
          done
          kill -0 "$server_pid"
          curl -fsS "http://127.0.0.1:4174$base_path/publication.json" >/dev/null
          export PORTFOLIO_PAGES_AUDIT_URL="http://127.0.0.1:4174$base_path/"
          node Portfolio/scripts/pages-path-browser-audit.mjs
      - name: Upload the reviewable Pages copy
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pages_preview.outputs.artifact_name }}
          path: pages-site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  # Deliberate manual review only: native poster capture, V2 visual evidence and full-page screenshots.
  # These produce review artifacts rather than assertions, so they are not part of the qualification gate.
  evidence:
    name: evidence
    needs: [scope, record]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.retain_detailed_evidence && needs.record.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/node-ux
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.record.outputs.media_artifact }}
          path: site/assets
      - name: Capture review evidence
        shell: bash
        env:
          PORTFOLIO_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail
          rm -- site/assets/homepage-model-loop.source site/assets/homepage-model-loop.sha256
          ./node_modules/.bin/serve site -l tcp://127.0.0.1:4173 >/tmp/portfolio-serve.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; wait "$server" 2>/dev/null || true' EXIT
          for _ in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          export PORTFOLIO_AUDIT_URL=http://127.0.0.1:4173
          mkdir -p ux-screenshots/logs
          node scripts/capture-model-posters.mjs || true
          node scripts/prepare-model-visual-evidence.mjs || true
          node scripts/capture-ux-screenshots.mjs || true
      - uses: actions/upload-artifact@v4
        with:
          name: ux-review-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ux-screenshots/
          if-no-files-found: warn
          retention-days: 3

  # The qualification gate Fleet reads by name. It succeeds only if every job this change
  # needed succeeded (see scripts/require_ux_jobs.py), so one required check covers the run.
  ux:
    name: ux
    needs: [scope, checks, record, lighthouse, build, audit, pages-copy]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require every qualification job
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          CHECKS: ${{ needs.scope.outputs.checks }}
          MEDIA: ${{ needs.scope.outputs.media }}
          LIGHTHOUSE: ${{ needs.scope.outputs.lighthouse }}
          BUNDLE: ${{ needs.scope.outputs.bundle }}
          PAGES: ${{ needs.scope.outputs.pages }}
          AUDITS: ${{ needs.scope.outputs.audits }}
        run: python3 scripts/require_ux_jobs.py
      - name: Summarize public source qualification
        shell: bash
        env:
          FAST_PATH: ${{ needs.scope.outputs.fast_path }}
        run: |
          if [ "${{ needs.scope.outputs.review_scope }}" = documentation ]; then
            echo "- Qualification mode: documentation-only PR review; site runtime is unchanged." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$FAST_PATH" = true ]; then
            echo "- Qualification mode: scoped ARCC routing fast path; visual, interaction, model, screenshot, and Lighthouse audits were not applicable to the changed paths." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ needs.scope.outputs.review_scope }}" = page-text ]; then
            echo "- Qualification mode: scoped PR text-only review; existing main-push qualification is unchanged." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ needs.scope.outputs.review_scope }}" = article-audit ]; then
            echo "- Qualification mode: focused PR article-model audit; existing main-push qualification is unchanged." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ needs.scope.outputs.review_scope }}" = search ]; then
            echo "- Qualification mode: scoped PR search review; existing main-push qualification is unchanged." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Qualification mode: full Portfolio UX suite." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            {
              echo "## Portfolio source qualified for Fleet review"
              echo
              echo "- Source: pH34r-pH/Portfolio@$GITHUB_SHA"
              echo '- Gate: Portfolio UX quality / ux passed for this exact main SHA.'
              echo "- Private publication: Fleet verifies this run and all pinned research inputs, then records a separate deployment receipt."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo "PR UX result is review evidence; Fleet requires a separate passing main SHA." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Manual Pages build is review evidence; it does not qualify a Fleet publication candidate." >> "$GITHUB_STEP_SUMMARY"
          fi


  deploy-pages:
    name: Deploy reviewed Pages build
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_pages && needs.ux.result == 'success' }}
    needs: [ux, pages-copy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Refuse custom domains or unexpected project paths
        shell: bash
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -euo pipefail
          repository_name="${GITHUB_REPOSITORY#*/}"
          expected_base_url="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/$repository_name"
          actual_base_url="${PAGES_BASE_URL%/}"
          if [[ "${actual_base_url,,}" != "${expected_base_url,,}" || "$PAGES_BASE_PATH" != "/$repository_name" ]]; then
            echo "Refusing deployment: expected $expected_base_url at /$repository_name; Pages reports $PAGES_BASE_URL at $PAGES_BASE_PATH. Check Pages settings before publishing." >&2
            exit 1
          fi
      - name: Download the exact Pages copy from the build job
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.pages-copy.outputs.artifact_name }}
          path: pages-site
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-site
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record deployed Pages URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: echo "Published the reviewed Pages artifact at $PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
