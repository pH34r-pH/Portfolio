name: Portfolio UX quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: portfolio-ux-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify UX qualification scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BASE_SHA"
          fi

          fast_path=false
          reason="full UX qualification required"
          if [[ "$base" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$base" =~ ^0+$ ]] && [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            mapfile -t changed < <(git diff --name-only "$base" "$HEAD_SHA")
            mapfile -t deleted < <(git diff --diff-filter=D --name-only "$base" "$HEAD_SHA")
            allowed=true
            saw_route_change=false

            if [ "${#changed[@]}" -eq 0 ] || [ "${#deleted[@]}" -ne 0 ]; then
              allowed=false
            fi

            for path in "${changed[@]}"; do
              case "$path" in
                site/card.md|site/staticwebapp.config.json)
                  saw_route_change=true
                  ;;
                scripts/test_static_webapp_config.py|.github/workflows/ux-quality.yml)
                  ;;
                *)
                  allowed=false
                  ;;
              esac
            done

            if [ "$allowed" = true ] && [ "$saw_route_change" = true ]; then
              fast_path=true
              reason="only ARCC route/profile serving files and their dedicated regression/CI definition changed"
            fi

            {
              echo "### UX scope classification"
              echo
              echo "- Base: `$base`"
              echo "- Head: `$HEAD_SHA`"
              echo "- Fast path: `$fast_path`"
              echo "- Reason: $reason"
              echo "- Changed paths:"
              printf '  - `%s`\n' "${changed[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "fast_path=$fast_path" >> "$GITHUB_OUTPUT"
      - name: Validate scoped ARCC routing contract
        if: ${{ steps.scope.outputs.fast_path == 'true' }}
        run: python3 scripts/test_static_webapp_config.py
      - uses: actions/setup-python@v5
        if: ${{ steps.scope.outputs.fast_path != 'true' }}
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: ${{ steps.scope.outputs.fast_path != 'true' }}
        with:
          node-version: '22'
      - name: Install locked audit tooling
        if: ${{ steps.scope.outputs.fast_path != 'true' }}
        run: npm ci
      - name: Install homepage media renderer
        if: ${{ steps.scope.outputs.fast_path != 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Render pre-built homepage model loop
        if: ${{ steps.scope.outputs.fast_path != 'true' }}
        run: node scripts/build-homepage-loop.mjs
      - name: Install Chromium
        if: ${{ steps.scope.outputs.fast_path != 'true' }}
        run: npx playwright install --with-deps chromium
      - name: Check UX environment
        if: ${{ steps.scope.outputs.fast_path != 'true' }}
        run: python3 scripts/preflight_env.py ux
      - name: Check source syntax and audit regressions
        if: ${{ steps.scope.outputs.fast_path != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/build-homepage-loop.mjs
          for asset in site appearance article-runtime model-machine model-scene model-topology model-light model-gestures homepage-background homepage-model-loader homepage-digital research-topology search; do
            node --check "site/assets/$asset.js"
          done
          node scripts/test-model-replay.mjs
          node scripts/test-model-instrument-orientation.mjs
          node scripts/test-article-release-observation.mjs
          node scripts/test-model-pixel-fidelity.mjs
          node scripts/test-article-runtime.mjs
          node scripts/test-interaction-coverage.mjs
          node scripts/test-jupyterlite-notebook-audit.mjs
          node scripts/test-lighthouse-transfer-budget.mjs
          node scripts/test-serve-lhci.mjs
      - name: Run responsive, accessibility, interaction and model audits
        if: ${{ steps.scope.outputs.fast_path != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/serve site -l tcp://127.0.0.1:4173 >/tmp/portfolio-serve.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; wait "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          kill -0 "$server"
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          export PORTFOLIO_AUDIT_URL=http://127.0.0.1:4173
          mkdir -p ux-screenshots/logs
          status=0
          # Retain each audit's evidence after a failure without relaxing any gate.
          run_audit() {
            local name="$1"
            shift
            if "$@" 2>&1 | tee "ux-screenshots/logs/$name.log"; then
              return 0
            else
              echo "Audit failed: $name" >&2
              status=1
            fi
          }
          run_audit model-posters node scripts/capture-model-posters.mjs
          run_audit model-startup-regressions node scripts/test-model-startup.mjs
          run_audit model-visual env MODEL_VISUAL_EVIDENCE_DIR=ux-screenshots/visual-v2/visual-audit node scripts/model-visual-audit.mjs
          run_audit ux node scripts/ux-audit.mjs
          run_audit interaction node scripts/interaction-audit.mjs
          run_audit 2071 node scripts/2071-audit.mjs
          run_audit model-machine node scripts/model-machine-audit.mjs
          run_audit model-glass env GLASS_EVIDENCE_DIR=ux-screenshots/leaf03-glass node scripts/model-glass-audit.mjs
          run_audit model-startup node scripts/model-startup-audit.mjs
          # The homepage audit invokes homepageLifecycle and native finger-scroll checks.
          run_audit homepage-digital-and-lifecycle node scripts/homepage-digital-audit.mjs
          run_audit appearance env PORTFOLIO_STYLE_SCREENSHOTS=ux-screenshots/appearance node scripts/appearance-audit.mjs
          run_audit screenshots node scripts/capture-ux-screenshots.mjs
          exit "$status"
      - name: Prepare bounded V2 model visual review evidence
        if: ${{ always() && steps.scope.outputs.fast_path != 'true' }}
        shell: bash
        env:
          PORTFOLIO_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/prepare-model-visual-evidence.mjs
      - name: Upload UX review screenshots
        if: ${{ always() && steps.scope.outputs.fast_path != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ux-review-${{ github.event.pull_request.head.sha || github.sha }}
          path: ux-screenshots/visual-v2/review/**
          if-no-files-found: error
          retention-days: 3
      - name: Upload all source audit screenshots and reports
        if: ${{ always() && steps.scope.outputs.fast_path != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ux-audit-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ux-screenshots/
          if-no-files-found: error
          retention-days: 3
      - name: Upload Leaf03 shared-glass regression evidence
        if: ${{ always() && steps.scope.outputs.fast_path != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: leaf03-glass-regression-${{ github.event.pull_request.head.sha || github.sha }}
          path: ux-screenshots/leaf03-glass/**
          if-no-files-found: error
          retention-days: 3
      - name: Enforce Lighthouse budgets (mobile and desktop)
        if: ${{ !cancelled() && steps.scope.outputs.fast_path != 'true' }}
        shell: bash
        run: |
          set -uo pipefail
          rm -f lhci-server.log
          node scripts/serve-lhci.mjs site > lhci-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; wait "$server" 2>/dev/null || true' EXIT
          port=''
          ready=false
          for _ in {1..30}; do
            port="$(sed -n 's/^PORT=//p' lhci-server.log | tail -n 1)"
            if [[ "$port" =~ ^[0-9]+$ ]] && \
              curl -fsS "http://127.0.0.1:$port/" >/dev/null && \
              curl -fsS "http://127.0.0.1:$port/about/" >/dev/null && \
              curl -fsS "http://127.0.0.1:$port/atlas/" >/dev/null && \
              curl -fsS "http://127.0.0.1:$port/reproduce/" >/dev/null && \
              curl -fsS "http://127.0.0.1:$port/research/" >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat lhci-server.log
            echo 'Owned Lighthouse server did not become ready for every audited route.' >&2
            exit 1
          fi
          export PORTFOLIO_LHCI_BASE_URL="http://127.0.0.1:$port"
          status=0
          npx lhci autorun --config=./lighthouserc.cjs || status=$?
          desktop_status=0
          npx lhci autorun --config=./lighthouserc.desktop.cjs || desktop_status=$?
          if [ "$status" -ne 0 ] || [ "$desktop_status" -ne 0 ]; then
            echo "LHCI failures: mobile=$status desktop=$desktop_status" >&2
            exit 1
          fi
      - name: Check initial-page transfer policy
        if: ${{ always() && steps.scope.outputs.fast_path != 'true' }}
        run: node scripts/lighthouse-transfer-budget.mjs --dir ./lighthouse-results --dir ./lighthouse-results-desktop
      - name: Retain raw Lighthouse reports
        if: ${{ always() && steps.scope.outputs.fast_path != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            lighthouse-results/
            lighthouse-results-desktop/
            lhci-server.log
          if-no-files-found: warn
          retention-days: 30
      - name: Summarize public source qualification
        shell: bash
        env:
          FAST_PATH: ${{ steps.scope.outputs.fast_path }}
        run: |
          if [ "$FAST_PATH" = true ]; then
            echo "- Qualification mode: scoped ARCC routing fast path; visual, interaction, model, screenshot, and Lighthouse audits were not applicable to the changed paths." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Qualification mode: full Portfolio UX suite." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            {
              echo "## Portfolio source qualified for Fleet review"
              echo
              echo "- Source: pH34r-pH/Portfolio@$GITHUB_SHA"
              echo '- Gate: Portfolio UX quality / ux passed for this exact main SHA.'
              echo "- Private publication: Fleet verifies this run and all pinned research inputs, then records a separate deployment receipt."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "PR UX result is review evidence; Fleet requires a separate passing main SHA." >> "$GITHUB_STEP_SUMMARY"
          fi

  bundle:
    name: Public publication candidate
    needs: ux
    # Continue review qualification after UX failure; only successful UX may publish an artifact.
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Pin public input revisions
        id: refs
        shell: bash
        env:
          PORTFOLIO_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          portfolio="$PORTFOLIO_SOURCE_SHA"
          research_notes="$(git ls-remote https://github.com/pH34r-pH/research-notes.git refs/heads/main | cut -f1)"
          theorem_library="$(git ls-remote https://github.com/pH34r-pH/theorem-library.git refs/heads/main | cut -f1)"
          for revision in "$portfolio" "$research_notes" "$theorem_library"; do
            [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo 'Expected full source commit SHAs'; exit 1; }
          done
          {
            echo "portfolio=$portfolio"
            echo "research_notes=$research_notes"
            echo "theorem_library=$theorem_library"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.refs.outputs.portfolio }}
          path: Portfolio
          persist-credentials: false
      - name: Read immutable public Compiler input pin
        id: compiler
        run: python3 Portfolio/scripts/compiler_projection_input.py --pin Portfolio/publication/compiler-projection.lock.json >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: pH34r-pH/experiment-compiler
          ref: ${{ steps.compiler.outputs.commit }}
          path: experiment-compiler
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: pH34r-pH/research-notes
          ref: ${{ steps.refs.outputs.research_notes }}
          path: research-notes
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: pH34r-pH/theorem-library
          ref: ${{ steps.refs.outputs.theorem_library }}
          path: theorem-library
          persist-credentials: false
      - name: Confirm pinned checkouts
        shell: bash
        env:
          PORTFOLIO_SHA: ${{ steps.refs.outputs.portfolio }}
          RESEARCH_NOTES_SHA: ${{ steps.refs.outputs.research_notes }}
          THEOREM_LIBRARY_SHA: ${{ steps.refs.outputs.theorem_library }}
          COMPILER_SHA: ${{ steps.compiler.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(git -C Portfolio rev-parse HEAD)" = "$PORTFOLIO_SHA"
          test "$(git -C research-notes rev-parse HEAD)" = "$RESEARCH_NOTES_SHA"
          test "$(git -C theorem-library rev-parse HEAD)" = "$THEOREM_LIBRARY_SHA"
          test "$(git -C experiment-compiler rev-parse HEAD)" = "$COMPILER_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Portfolio/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - uses: typst-community/setup-typst@v4
      - name: Install document export image conversion
        run: |
          sudo apt-get update
          sudo apt-get install -y inkscape ffmpeg
      - name: Install pinned Portfolio and MyST browser tooling
        run: npm ci --prefix Portfolio
      - name: Render pre-built homepage model loop
        run: node Portfolio/scripts/build-homepage-loop.mjs
      - name: Prepare isolated article export sources
        run: |
          python3 Portfolio/scripts/prepare_article_exports.py \
            --research-notes research-notes \
            --output research-notes-exports \
            --manifest article-exports.json
      - name: Build PDF, Word, LaTeX and JATS article exports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/portfolio-article-export-sources
          import json
          for item in json.load(open('article-exports.json', encoding='utf-8')):
              print(item['source'])
          PY
          while IFS= read -r source; do
            (cd research-notes-exports && ../Portfolio/node_modules/.bin/myst build "$source" --ci)
          done < /tmp/portfolio-article-export-sources
      - name: Render canonical MyST articles from the pinned Research Notes checkout
        working-directory: research-notes
        run: ../Portfolio/node_modules/.bin/myst build --html --strict --ci
      - name: Install locked publication tooling
        run: uv sync --project Portfolio --locked --no-dev
      - name: Check publication environment
        run: uv run --project Portfolio --no-sync python Portfolio/scripts/preflight_env.py publication
      - name: Check reader and publication code
        run: |
          uv run --project Portfolio --no-sync python -m py_compile Portfolio/scripts/build_portfolio_bundle.py Portfolio/scripts/finish_portfolio_lab.py Portfolio/scripts/digest_bundle.py Portfolio/scripts/compiler_projection_input.py
          uv run --project Portfolio --no-sync python Portfolio/scripts/test_portfolio_publication.py
      - name: Generate the pinned Compiler public static projection
        run: python3 experiment-compiler/scripts/build_pages_site.py --output compiler-public
      - name: Assemble immutable public inputs
        env:
          PORTFOLIO_SHA: ${{ steps.refs.outputs.portfolio }}
          RESEARCH_NOTES_SHA: ${{ steps.refs.outputs.research_notes }}
          THEOREM_LIBRARY_SHA: ${{ steps.refs.outputs.theorem_library }}
        run: |
          uv run --project Portfolio --no-sync python Portfolio/scripts/build_portfolio_bundle.py \
            --portfolio Portfolio --research-notes research-notes \
            --theorem-library theorem-library \
            --myst-html research-notes/_build/html/index.html --output bundle \
            --portfolio-sha "$PORTFOLIO_SHA" \
            --research-notes-sha "$RESEARCH_NOTES_SHA" \
            --theorem-library-sha "$THEOREM_LIBRARY_SHA" \
            --compiler-projection compiler-public/data/experiments.json \
            --compiler-projection-pin Portfolio/publication/compiler-projection.lock.json
      - name: Attach static article export artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/article-exports
          python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path
          records = json.load(open('article-exports.json', encoding='utf-8'))
          source = Path('research-notes-exports/articles/_build/exports')
          target = Path('bundle/article-exports')
          for item in records:
              for key in ('pdf', 'docx', 'latex', 'jats'):
                  name = item[key]
                  artifact = source / name
                  if not artifact.is_file():
                      raise SystemExit(f'Missing MyST export: {artifact}')
                  shutil.copy2(artifact, target / name)
          print(f"Attached {len(records) * 4} article exports")
          PY
      - name: Validate pinned publication manifest
        env:
          PORTFOLIO_SHA: ${{ steps.refs.outputs.portfolio }}
          RESEARCH_NOTES_SHA: ${{ steps.refs.outputs.research_notes }}
          THEOREM_LIBRARY_SHA: ${{ steps.refs.outputs.theorem_library }}
          COMPILER_SHA: ${{ steps.compiler.outputs.commit }}
          COMPILER_PROJECTION_SHA256: ${{ steps.compiler.outputs.sha256 }}
        run: |
          uv run --project Portfolio --no-sync python - <<'PY'
          import json
          import os
          from pathlib import Path
          from jsonschema import Draft202012Validator

          manifest = json.loads(Path('bundle/publication.json').read_text())
          schema = json.loads(Path('Portfolio/publication.schema.json').read_text())
          Draft202012Validator(schema).validate(manifest)
          assert manifest['schemaVersion'] == 2
          assert {key: value['commit'] for key, value in manifest['sources'].items()} == {
              'portfolio': os.environ['PORTFOLIO_SHA'],
              'researchNotes': os.environ['RESEARCH_NOTES_SHA'],
              'theoremLibrary': os.environ['THEOREM_LIBRARY_SHA'],
          }
          assert manifest['compilerProjection'] == {
              'repository': 'pH34r-pH/experiment-compiler',
              'commit': os.environ['COMPILER_SHA'],
              'sha256': os.environ['COMPILER_PROJECTION_SHA256'],
              'schemaVersion': 2,
          }
          atlas = json.loads(Path('bundle/data/atlas-evidence.json').read_text())
          atlas_schema = json.loads(Path('Portfolio/atlas-evidence.schema.json').read_text())
          Draft202012Validator(atlas_schema).validate(atlas)
          PY
      - name: Build JupyterLite
        run: |
          uv run --project Portfolio --no-sync jupyter lite build --contents bundle/publication/lab-contents \
            --output-dir bundle/lab --lite-dir Portfolio
      - name: Attach Portfolio Lab navigation
        run: uv run --project Portfolio --no-sync python Portfolio/scripts/finish_portfolio_lab.py --portfolio Portfolio --bundle bundle
      - name: Build static publication search index
        run: npx --yes pagefind@1.5.2 --site bundle --output-subdir pagefind --force-language en
      - name: Qualify finished public bundle
        shell: bash
        run: |
          set -euo pipefail
          for path in bundle/index.html bundle/publication.json bundle/data/atlas-evidence.json \
            bundle/pagefind/pagefind.js bundle/lab/index.html bundle/lab/lab/index.html bundle/lab/files/reference/glossary.md \
            bundle/lab/reference/glossary.md; do
            test -s "$path"
          done
          count="$(find bundle/publication/notebooks -name '*.ipynb' -type f | wc -l)"
          test "$count" -gt 0
          python - <<'PY'
          import hashlib, json, zipfile
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = Path('bundle')
          manifest = json.loads((root / 'publication.json').read_text())
          articles = manifest.get('articles')
          assert isinstance(articles, list) and articles, 'No canonical articles in the exact bundle'
          for article in articles:
              route = root / article['url'].strip('/') / 'index.html'
              source = root / article['path']
              assert route.is_file() and source.is_file(), f"Missing article route or source: {article['slug']}"
              assert hashlib.sha256(route.read_bytes()).hexdigest() == article['renderedSha256']
              assert hashlib.sha256(source.read_bytes()).hexdigest() == article['sha256']
              body = route.read_text(encoding='utf-8')
              assert 'myst-reader' in body and 'Canonical MyST source' in body
              for label in ('PDF', 'Word', 'LaTeX source', 'JATS XML'):
                  assert label in body, f"Missing article download link {label}: {article['slug']}"
              downloads = {kind: root / path.lstrip('/') for kind, path in article['downloads'].items()}
              assert set(downloads) == {'pdf', 'docx', 'latex', 'jats'}
              for kind, artifact in downloads.items():
                  assert artifact.is_file() and artifact.stat().st_size > 0, f"Missing {kind} export: {article['slug']}"
              assert downloads['pdf'].read_bytes().startswith(b'%PDF-'), f"Invalid PDF export: {article['slug']}"
              assert zipfile.is_zipfile(downloads['docx']), f"Invalid DOCX export: {article['slug']}"
              assert zipfile.is_zipfile(downloads['latex']), f"Invalid LaTeX ZIP: {article['slug']}"
              with zipfile.ZipFile(downloads['latex']) as archive:
                  assert any(name.endswith('.tex') for name in archive.namelist()), f"LaTeX ZIP has no .tex source: {article['slug']}"
              ET.parse(downloads['jats'])
              for asset in article['assets']:
                  assert (root / 'publication/article-assets' / asset).is_file(), f"Missing MyST asset: {asset}"
              if article['browserExecution']:
                  assert '/assets/article-runtime.js' in body
                  assert (root / 'assets/thebe/thebe-lite.min.js').is_file()
                  assert (root / 'assets/thebe/index.js').is_file()
                  assert (root / 'lab/lab/index.html').is_file()
          print(f"Qualified {len(manifest['notebooks'])} source notebooks and {len(articles)} canonical articles")
          PY
      - name: Exercise article, notebook and model routes in the exact bundle
        shell: bash
        run: |
          set -euo pipefail
          Portfolio/node_modules/.bin/playwright install --with-deps chromium
          Portfolio/node_modules/.bin/serve bundle -l tcp://127.0.0.1:4173 >/tmp/portfolio-candidate-serve.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          kill -0 "$server_pid"
          curl -fsS http://127.0.0.1:4173/publication.json >/dev/null
          cd Portfolio
          export PORTFOLIO_AUDIT_URL=http://127.0.0.1:4173
          export PORTFOLIO_PUBLICATION_BUNDLE=1
          mkdir -p ux-screenshots/logs
          status=0
          run_audit() {
            local name="$1"
            shift
            if "$@" 2>&1 | tee "ux-screenshots/logs/$name.log"; then
              return 0
            else
              echo "Audit failed: $name" >&2
              status=1
            fi
          }
          run_audit model-replay node scripts/test-model-replay.mjs
          run_audit ux node scripts/ux-audit.mjs
          # interaction-audit invokes the real article and JupyterLite notebook audits.
          run_audit interaction-articles-and-notebooks node scripts/interaction-audit.mjs
          run_audit 2071 node scripts/2071-audit.mjs
          run_audit homepage-digital-and-lifecycle node scripts/homepage-digital-audit.mjs
          run_audit model-startup node scripts/model-startup-audit.mjs
          run_audit model-machine node scripts/model-machine-audit.mjs
          run_audit model-glass env GLASS_EVIDENCE_DIR=ux-screenshots/leaf03-glass node scripts/model-glass-audit.mjs
          run_audit model-visual env PORTFOLIO_PUBLISHED_AUDIT_URL="$PORTFOLIO_AUDIT_URL" MODEL_VISUAL_EVIDENCE_DIR=ux-screenshots/visual-v2/visual-audit node scripts/model-visual-audit.mjs
          run_audit article-model-sticky node scripts/article-model-sticky-audit.mjs
          run_audit appearance env PORTFOLIO_STYLE_SCREENSHOTS=ux-screenshots/appearance node scripts/appearance-audit.mjs
          run_audit screenshots node scripts/capture-ux-screenshots.mjs
          exit "$status"
      - name: Upload all finished-bundle audit screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-ux-review-${{ github.event.pull_request.head.sha || github.sha }}
          path: Portfolio/ux-screenshots/
          if-no-files-found: error
          retention-days: 3
      - name: Hash exact upload bytes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ux.result == 'success'
        id: digest
        shell: bash
        run: echo "sha256=$(uv run --project Portfolio --no-sync python Portfolio/scripts/digest_bundle.py bundle)" >> "$GITHUB_OUTPUT"
      - name: Upload public publication candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ux.result == 'success'
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-candidate-${{ steps.refs.outputs.portfolio }}-${{ steps.refs.outputs.research_notes }}-${{ steps.refs.outputs.theorem_library }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: bundle/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Summarize public candidate for private verification
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ux.result == 'success'
        env:
          PORTFOLIO_SHA: ${{ steps.refs.outputs.portfolio }}
          RESEARCH_NOTES_SHA: ${{ steps.refs.outputs.research_notes }}
          THEOREM_LIBRARY_SHA: ${{ steps.refs.outputs.theorem_library }}
          COMPILER_SHA: ${{ steps.compiler.outputs.commit }}
          COMPILER_PROJECTION_SHA256: ${{ steps.compiler.outputs.sha256 }}
          BUNDLE_SHA256: ${{ steps.digest.outputs.sha256 }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_SHA256: ${{ steps.upload.outputs.artifact-digest }}
        shell: bash
        run: |
          {
            echo '## Public Portfolio publication candidate'
            echo
            echo "- Portfolio source: $PORTFOLIO_SHA"
            echo "- research-notes source: $RESEARCH_NOTES_SHA"
            echo "- theorem-library source: $THEOREM_LIBRARY_SHA"
            echo "- Compiler public projection source: $COMPILER_SHA"
            echo "- Compiler public projection SHA-256: $COMPILER_PROJECTION_SHA256"
            echo "- Full bundle tree SHA-256: $BUNDLE_SHA256"
            echo "- Exact artifact ID: $ARTIFACT_ID"
            echo "- GitHub artifact ZIP SHA-256: $ARTIFACT_SHA256"
            echo "- Public source and producer run/attempt: $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
            echo '- Private Fleet must recheck all source gates and the downloaded bundle digest before publication.'
          } >> "$GITHUB_STEP_SUMMARY"
