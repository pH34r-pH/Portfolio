name: Structural quality audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: ESLint + Lizard + jscpd
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Lizard
        run: python -m pip install --disable-pip-version-check "lizard==1.24.0"

      - name: Native JavaScript structural lint (audit only)
        shell: bash
        run: |
          set +e
          mkdir -p quality-audit
          npx --yes eslint@9.38.0 site scripts \
            --no-config-lookup \
            --ext .js,.mjs,.cjs \
            --rule 'max-lines: ["warn", {"max": 500, "skipBlankLines": true, "skipComments": true}]' \
            --rule 'max-lines-per-function: ["warn", {"max": 75, "skipBlankLines": true, "skipComments": true}]' \
            --rule 'complexity: ["warn", 15]' \
            --rule 'max-params: ["warn", 7]' \
            --rule 'max-depth: ["warn", 4]' \
            > quality-audit/eslint-structural.txt 2>&1
          status=$?
          cat quality-audit/eslint-structural.txt
          echo "eslint_status=$status" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Lizard structural metrics (audit only)
        shell: bash
        run: |
          set +e
          lizard site scripts -C 15 -L 75 -a 7 -w > quality-audit/lizard.txt 2>&1
          status=$?
          cat quality-audit/lizard.txt
          echo "lizard_status=$status" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Copy/paste duplication audit (audit only)
        shell: bash
        run: |
          set +e
          npx --yes jscpd@5.0.12 site scripts \
            --min-lines 8 --min-tokens 60 \
            --format javascript,typescript \
            --ignore "**/node_modules/**,**/dist/**,**/build/**,**/*-lock.json" \
            --reporters console,json --output quality-audit/jscpd \
            > quality-audit/jscpd-console.txt 2>&1
          status=$?
          cat quality-audit/jscpd-console.txt
          echo "jscpd_status=$status" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Enforce no structural regression
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base_dir="$RUNNER_TEMP/quality-base"
          git worktree add --detach "$base_dir" "$BASE_SHA"
          mkdir -p quality-audit/base
          (
            cd "$base_dir"
            set +e
            npx --yes eslint@9.38.0 site scripts               --no-config-lookup --ext .js,.mjs,.cjs               --rule 'max-lines: ["warn", {"max": 500, "skipBlankLines": true, "skipComments": true}]'               --rule 'max-lines-per-function: ["warn", {"max": 75, "skipBlankLines": true, "skipComments": true}]'               --rule 'complexity: ["warn", 15]'               --rule 'max-params: ["warn", 7]'               --rule 'max-depth: ["warn", 4]'               > "$GITHUB_WORKSPACE/quality-audit/base/eslint.txt" 2>&1
            lizard site scripts -C 15 -L 75 -a 7 -w > "$GITHUB_WORKSPACE/quality-audit/base/lizard.txt" 2>&1
            npx --yes jscpd@5.0.12 site scripts               --min-lines 8 --min-tokens 60 --format javascript,typescript               --ignore "**/node_modules/**,**/dist/**,**/build/**,**/*-lock.json"               --reporters console > "$GITHUB_WORKSPACE/quality-audit/base/jscpd.txt" 2>&1
            true
          )
          count_eslint() { grep -Eo '✖ [0-9]+ problems?' "$1" | tail -1 | grep -Eo '[0-9]+' || echo 0; }
          count_lizard() { grep -c 'warning: .* NLOC,' "$1" || true; }
          count_clones() { grep -Eo 'Found [0-9]+ clones?\.' "$1" | tail -1 | grep -Eo '[0-9]+' || echo 0; }
          head_eslint="$(count_eslint quality-audit/eslint-structural.txt)"; base_eslint="$(count_eslint quality-audit/base/eslint.txt)"
          head_lizard="$(count_lizard quality-audit/lizard.txt)"; base_lizard="$(count_lizard quality-audit/base/lizard.txt)"
          head_clones="$(count_clones quality-audit/jscpd-console.txt)"; base_clones="$(count_clones quality-audit/base/jscpd.txt)"
          {
            echo; echo "### Quality ratchet"; echo "| Signal | Base | Head |"; echo "| --- | ---: | ---: |"
            echo "| ESLint structural findings | $base_eslint | $head_eslint |"
            echo "| Lizard structural findings | $base_lizard | $head_lizard |"
            echo "| jscpd clone blocks | $base_clones | $head_clones |"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$head_eslint" -le "$base_eslint" || { echo "::error::ESLint structural findings increased"; exit 1; }
          test "$head_lizard" -le "$base_lizard" || { echo "::error::Lizard structural findings increased"; exit 1; }
          test "$head_clones" -le "$base_clones" || { echo "::error::Duplication clone blocks increased"; exit 1; }

      - name: Largest source files
        shell: bash
        run: |
          {
            echo "### Largest source files (physical lines; audit only)"
            echo '~~~'
            find site scripts -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -print0 \
              | xargs -0 -r wc -l | sort -nr | head -41
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structural-quality-audit-${{ github.sha }}
          path: quality-audit/
          if-no-files-found: warn
          retention-days: 14
